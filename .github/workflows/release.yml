name: Release

on:
  push:
    tags:
      - 'v*'                # tag like v0.6.1 → trigger release build
  workflow_dispatch:        # also allow manual trigger from GitHub UI

permissions:
  contents: write           # needed to create/update Releases

jobs:
  build:
    runs-on: macos-15       # Apple Silicon, modern Xcode, hardened runtime support
    timeout-minutes: 60     # notarization can take a while; cap to keep CI sane

    env:
      # Apple notarization (App Store Connect API key — base64 encoded in secret)
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      # Developer ID identity (must match the cert imported below)
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ── Decode and stage Apple credentials from GitHub secrets ──────────
      - name: Stage Apple credentials
        env:
          DEV_ID_P12_BASE64: ${{ secrets.DEV_ID_P12_BASE64 }}
          DEV_ID_P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys

          # 1. Save the App Store Connect API .p8 to a stable path
          echo "$APPLE_API_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

          # 2. Create a temporary keychain dedicated to this build
          KC_PATH="$RUNNER_TEMP/oling-build.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 3600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security list-keychains -d user -s "$KC_PATH" $(security list-keychains -d user | sed -e s/\"//g)

          # 3. Import the Developer ID Application .p12 into that keychain
          echo "$DEV_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" \
            -k "$KC_PATH" \
            -P "$DEV_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC_PATH" >/dev/null
          rm -f "$RUNNER_TEMP/devid.p12"

          echo "OLING_SIGNING_KEYCHAIN=$KC_PATH" >> "$GITHUB_ENV"
          echo "OLING_SIGNING_KEYCHAIN_PASSWORD=$KC_PASS" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        run: bun run make-dmg

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Oling.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
